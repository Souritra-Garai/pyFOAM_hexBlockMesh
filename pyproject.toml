[build-system]
requires	= ["setuptools>=45", "wheel"]
build-backend	= "setuptools.build_meta"

[project]
name	= "pyFOAM_hexBlockMesh"
version = "0.1.0"
readme	= "README.md"
authors = [
	{name	= "Souritra Garai"},
]
description	= "A Python package for creating hex block meshes for OpenFOAM"
requires-python = ">=3.6"
classifiers	= [
	"Programming Language :: Python :: 3",
	"Operating System :: POSIX :: Linux",
]
dependencies	= [
	"numpy",
]

[project.urls]
Homepage	= "https://github.com/Souritra-Garai/pyFOAM_hexBlockMesh"
Repository	= "https://github.com/Souritra-Garai/pyFOAM_hexBlockMesh"

[tool.setuptools.packages.find]
where	= ["."]
include	= ["pyFOAM_hexBlockMesh*"]
